<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6fb">
  <title>Como chegar · Chácara Glamour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue-050:#f4f9fc;
      --blue-100:#eaf4fa;
      --blue-200:#d8eaf5;
      --blue-400:#9fc7df;
      --blue-600:#6998b8;
      --pink-100:#fceaf0;
      --pink-200:#f8ceda;
      --pink-400:#ee9fb6;
      --pink-500:#e987a4;
      --taupe:#9e928a;
      --text:#5f5651;
      --muted:#918782;
      --white:#fff;
      --shadow:0 18px 50px rgba(79,112,135,.13);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:'Nunito',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),
        repeating-linear-gradient(90deg,#fff 0 46px,#c9e3f3 46px 92px);
      -webkit-font-smoothing:antialiased;
    }
    .shell{
      width:min(100%,650px);
      margin:0 auto;
      padding:18px 14px max(30px,env(safe-area-inset-bottom));
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:44px;
      padding:10px 15px;
      margin:0 0 14px;
      border:1px solid rgba(105,152,184,.25);
      border-radius:999px;
      background:rgba(255,255,255,.9);
      box-shadow:0 8px 22px rgba(79,112,135,.08);
      color:#746b66;
      text-decoration:none;
      font-size:13px;
      font-weight:700;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .back svg{width:17px;height:17px}
    .card{
      overflow:hidden;
      border:1px solid rgba(159,199,223,.42);
      border-radius:30px;
      background:rgba(255,255,255,.96);
      box-shadow:var(--shadow);
    }
    .hero{
      padding:28px 24px 22px;
      text-align:center;
      background:
        radial-gradient(circle at 100% 0,rgba(248,206,218,.6),transparent 32%),
        radial-gradient(circle at 0 100%,rgba(216,234,245,.72),transparent 34%),
        #fff;
    }
    .pin{
      width:58px;
      height:58px;
      margin:0 auto 10px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--pink-100);
      color:var(--blue-600);
    }
    .pin svg{width:30px;height:30px}
    h1{
      margin:0;
      font-family:'Pacifico',cursive;
      font-size:clamp(29px,8vw,38px);
      line-height:1.25;
      font-weight:400;
      color:var(--taupe);
    }
    .subtitle{
      margin:8px auto 0;
      max-width:430px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }
    .map-frame{
      position:relative;
      width:100%;
      aspect-ratio:4/3;
      min-height:320px;
      background:var(--blue-100);
    }
    .map-frame iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    .aerial-photo{
      padding:14px 14px 0;
      background:#fff;
    }
    .aerial-photo img{
      width:100%;
      height:auto;
      display:block;
      border-radius:20px;
      box-shadow:0 10px 28px rgba(79,112,135,.10);
    }
    .actions{
      padding:22px;
      display:grid;
      gap:12px;
    }
    .route-btn{
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      padding:13px 18px;
      border-radius:16px;
      text-decoration:none;
      font-size:15px;
      font-weight:700;
      transition:transform .16s ease,box-shadow .16s ease;
    }
    .route-btn:active{transform:scale(.985)}
    .route-btn svg{width:23px;height:23px;flex:0 0 auto}
    .google{
      color:#fff;
      background:#6998b8;
      box-shadow:0 9px 22px rgba(105,152,184,.24);
    }
    .waze{
      color:#665c57;
      background:#fceaf0;
      border:1px solid #f8ceda;
    }
    .place{
      padding:0 22px 24px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .place strong{color:var(--text)}
    .footer{
      padding:20px 10px 4px;
      text-align:center;
      color:rgba(95,86,81,.65);
      font-size:12px;
    }
    @media(max-width:480px){
      .shell{padding:12px 10px max(24px,env(safe-area-inset-bottom))}
      .card{border-radius:25px}
      .hero{padding:24px 18px 18px}
      .actions{padding:18px}
      .map-frame{min-height:300px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="index.html#confirmar" aria-label="Voltar para a página de confirmação">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar para confirmação
    </a>

    <section class="card" aria-labelledby="titulo-local">
      <div class="hero">
        <div class="pin" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-12a7 7 0 10-14 0c0 5.9 7 12 7 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9" r="2.6" fill="currentColor"/></svg>
        </div>
        <h1 id="titulo-local">Chácara Glamour</h1>
        <p class="subtitle">Escolha seu aplicativo de navegação preferido para traçar a rota até o Chá Revelação.</p>
      </div>

      <div class="map-frame" aria-label="Mapa da Chácara Glamour">
        <iframe
          title="Mapa da Chácara Glamour"
          src="https://maps.google.com/maps?q=-21.908946148658977,-50.521254579879745&z=18&t=k&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>


      <div class="aerial-photo">
        <img src="chacara-glamour.webp" alt="Vista aérea da Chácara Glamour com indicação do local" loading="lazy">
      </div>

      <div class="actions">
        <a class="route-btn google" href="https://www.google.com/maps/dir/?api=1&destination=-21.908946148658977,-50.521254579879745" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.1 7-12a7 7 0 10-14 0c0 5.9 7 12 7 12Z" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="9" r="2.5" fill="currentColor"/></svg>
          Abrir no Google Maps
        </a>

        <a class="route-btn waze" href="https://www.waze.com/ul?ll=-21.908946148658977%2C-50.521254579879745&navigate=yes" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 13.2c0-4.7 3.3-8.2 7.8-8.2 4.2 0 7.2 2.8 7.2 6.8 0 3.8-2.7 6.8-7 6.8H9l-2.5 1.7.5-2.7a6.7 6.7 0 01-2.5-4.4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9.5" cy="11.3" r=".9" fill="currentColor"/><circle cx="15" cy="11.3" r=".9" fill="currentColor"/><path d="M9.7 14c.7.8 1.6 1.2 2.7 1.2 1 0 2-.4 2.6-1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Abrir no Waze
        </a>
      </div>

      <div class="place">
        <strong>Chácara Glamour</strong><br>
        Coordenadas: -21.908946, -50.521255
      </div>
    </section>

    <div class="footer">Diogo &amp; Geovana · Chá Revelação</div>
  </main>
</body>
</html>
